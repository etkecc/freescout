name: CI (main)
on:
  push:
    branches: [ "main", "renovate/**" ]
  pull_request:
    branches: [ "main" ]
env:
  # renovate: datasource=github-releases depName=freescout-helpdesk/freescout
  freescout_version: 1.8.240
permissions:
  contents: read
  packages: write
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck rootfs/entrypoint.sh rootfs/usr/local/bin/*.sh rootfs/etc/s6/services/*/run

  build-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=v${{ env.freescout_version }},enable=${{ github.ref_name == 'main' }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          # Renovate branches (renovate/**) run this job as a build-only gate:
          # nothing is tagged or pushed until the change reaches main.
          push: ${{ github.ref_name == 'main' }}
          build-args: |
            FREESCOUT_VERSION=${{ env.freescout_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
